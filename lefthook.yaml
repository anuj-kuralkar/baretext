pre-commit:
  commands:
    fmt:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,css,md,yaml,yml}"
      run: bunx @biomejs/biome format --write --reporter=concise --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,css,md,yaml,yml}"
      run: bunx @biomejs/biome lint --reporter=concise --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    check:
      run: bun run check
    test:
      run: bun run test:unit -- --reporter=agent

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}
