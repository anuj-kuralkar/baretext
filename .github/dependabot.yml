version: 2

updates:
  - package-ecosystem: "bun"
    directories:
      - "/"
      - "/apps/*"
      - "/packages/*"

    schedule:
      interval: "monthly"

    groups:
      next-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "babel-plugin-react-compiler"

      elysia:
        patterns:
          - "elysia"
          - "@elysia/*"

      lexical:
        patterns:
          - "lexical"
          - "@lexical/*"

      tanstack:
        patterns:
          - "@tanstack/*"

      tailwindcss:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"

      drizzle:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"

      better-auth:
        patterns:
          - "better-auth"
          - "@better-auth/*"

      commitlint:
        patterns:
          - "@commitlint/*"

      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "vitest-browser-react"
